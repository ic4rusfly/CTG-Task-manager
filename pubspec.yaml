name: ctg_hub
description: CTG Hub — team chat, task management and a shared agenda for CTG members.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  collection: ^1.18.0
  uuid: ^4.4.0

  # ---------------------------------------------------------------------------
